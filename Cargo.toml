[workspace]
resolver = "2"
members = [
    "nuvra-app",
    "nuvra-render",
    "nuvra-platform-win",
    "nuvra-core-shared",
    "nuvra-mod-media",
    "nuvra-mod-mic",
    "nuvra-mod-notifications",
    "nuvra-mod-shelf",
    "nuvra-mod-clipboard",
]

[workspace.package]
version      = "0.0.1-dev"
edition      = "2021"
rust-version = "1.88"
authors      = ["Kesavaraja M"]
license      = "LicenseRef-Proprietary"

[workspace.dependencies]
# Windows API — D-STK-02
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Media_Audio",
    "ApplicationModel_DataTransfer",
    "UI_Notifications",
    "UI_ViewManagement",
] }

# Async runtime — D-ARC-01
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

# Logging — D-STK-06
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Database — D-STK-05
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto — D-DAT-01
aes-gcm       = "0.10"
zeroize       = { version = "1", features = ["derive"] }
blake3        = "1"
sha2          = "0.10"
argon2        = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Error handling
thiserror = "1"
anyhow    = "1"

# Channels / concurrency — D-ARCH-01
flume       = "0.11"
arc-swap    = "1"
parking_lot = "0.12"

# i18n — D-PRD-06, D-GLB-02
fluent-bundle = "0.15"
unic-langid   = "0.9"

# Audio / signal processing — 14.2 visualizer
rustfft = "6"

# Search — 15.3 launcher
nucleo = "0.5"

# Network (v2+, not used in Phase 0 / v1)
quinn   = "0.11"
rustls  = { version = "0.23", features = ["ring"] }
rcgen   = "0.13"
prost   = "0.13"
mdns-sd = "0.11"

# FFI (v2+ Android)
uniffi = "0.28"

# Testing — D-STK-08
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[profile.dev]
opt-level = 1
