[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "LicenseRef-Proprietary",  # nuvra crates themselves
]
copyleft = "deny"       # No GPL/LGPL/AGPL dependencies — R-26
private.ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

# No unapproved crates — D-ARC-01.
# If a crate appears that is not in the approved list, cargo deny check will warn.
# Engineers must add it via the Decision Protocol before merging.

[advisories]
ignore = []  # No exceptions. cargo audit must be clean (D-SEC-04).

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
