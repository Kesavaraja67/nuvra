name: CI

on:
  push:
    branches: ["release/**", "main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build, Lint, Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Tests
        run: cargo nextest run --workspace

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency policy
        run: cargo deny check

  msrv:
    name: Check MSRV (1.88)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Verify MSRV builds
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = "1.88"
          cargo check --workspace

  coverage:
    name: Coverage
    runs-on: windows-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Check coverage threshold
        shell: pwsh
        run: |
          # Minimum 80% line coverage on non-unsafe logic crates (Section 10)
          # Full enforcement added in v1; Phase 0 scaffold may be below threshold.
          Write-Host "Coverage report generated at lcov.info"
